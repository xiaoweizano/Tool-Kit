name: release
on:
  push: { tags: ['v*'] }
jobs:
  release:
    strategy:
      matrix: { os: [windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Set Electron mirror (China-friendly)
        run: echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
      - name: Set Electron Builder binary mirrors
        run: |
          echo "ELECTRON_BUILDER_ALLOW_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "SNAPPY_ARCH_SUFFIX=x64" >> $GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop
      - uses: softprops/action-gh-release@v2
        with: { draft: true, files: 'release/*.exe,release/*.dmg' }
