appId: com.toolkit.app
productName: ToolKit
directories:
  output: release
files:
  - out/**
asar: true
# Build-only: do NOT auto-publish to GitHub (handled by softprops/action-gh-release in CI)
publish: null
# Windows-specific icon (ICO with 16-256px entries)
win:
  icon: build/icons/icons/icon.ico
  target: nsis
nsis:
  oneClick: true
  perMachine: false
# macOS-specific icon (ICNS generated from 1024x1024.png, already valid)
mac:
  icon: build/icons/icons/icon.icns
  target: dmg
  identity: null
